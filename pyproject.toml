[project]
name = "estudos-python-ml"
version = "0.1.0"
description = ""
authors = [
    {name = "MateusMBN",email = "mateusborgesno@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit (>=1.57.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.5.6,<8.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "requests (>=2.34.2,<3.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "joblib (>=1.5.3,<2.0.0)"
]

[tool.poetry]
packages = [{include = "estudos_python_ml", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
